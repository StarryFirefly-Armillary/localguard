[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localguard-audit"
version = "0.1.0"
description = "Evidence-first local security auditing with native MCP tools"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.27.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "jsonschema>=4.23,<5", "httpx>=0.27,<1", "psutil>=6,<8",
  "tree-sitter>=0.25,<0.26", "tree-sitter-language-pack>=0.10,<0.11"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "anyio>=4,<5"]
train = ["transformers>=4.57", "peft>=0.17", "datasets>=3", "accelerate>=1", "bitsandbytes>=0.46"]

[project.scripts]
localguard = "localguard.__main__:main"

[tool.setuptools.packages.find]
include = ["localguard*"]

[tool.setuptools.package-data]
localguard = ["static/*", "rules/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
